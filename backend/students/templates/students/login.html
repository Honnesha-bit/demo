<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django login</title>
</head>
<body>
    
    <hr>
    <div class="login-box">
        <h2 style="color: aqua;background-color: beige;">Student login </h2>
        {%if error}
        <p class="error">{{error}}</p>
        {%endif %}
        <form action="" method="post">
            {% csrf_token %}
            <label for="">Username</label>
            <input type="text" name="User" id="" placeholder="Enter username" width="10px" height="5px" required><br><br>
            <label for="">Password</label>
            <input type="password" name="Pass" id="" placeholder="Enter password" required><br><br>

            <button type="submit" style="flex-direction: row;">login</button>
        </form>
    </div>
</body>
</html>
