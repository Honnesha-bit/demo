
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .dashboard-box {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h2 {
            color: #243b55;
            margin-bottom: 20px;
        }

        .username {
            color: #4169e1;
            font-size: 25px;
            margin-bottom: 30px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4169e1;
        }
    </style>
</head>

<body>

    <div class="dashboard-box">

        <h2>🎓 WELCOME</h2>

        <h2 class="username">{{ user.username }}</h2>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}

            <button type="submit">
                LOGOUT
            </button>
        </form>

    </div>

</body>
</html>
